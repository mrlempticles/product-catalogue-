# k8s/v2/deployment.yaml
#
# Deploys the product-catalogue-service as version v2.0.
# APP_VERSION=v2.0 enables: GET /health, GET /products,
#   GET /products/search?keyword=&category=&minPrice=&maxPrice= (with 400 validation)
#
# Namespace: catalogue-v2 (isolated from v1.0 and v1.1)
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalogue
  namespace: catalogue-v2
  labels:
    app: product-catalogue
    version: v2.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-catalogue
      version: v2.0
  template:
    metadata:
      labels:
        app: product-catalogue
        version: v2.0
    spec:
      containers:
        - name: product-catalogue
          # Same image as v1.0 and v1.1 — only APP_VERSION differs
          image: sadmomo/product-catalogue:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "v2.0"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
