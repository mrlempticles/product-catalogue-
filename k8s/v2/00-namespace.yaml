# k8s/v2/00-namespace.yaml
#
# Creates the catalogue-v2 namespace.
# Prefixed with 00- so kubectl apply -f k8s/v2/ processes it first
# (files are applied in lexicographic order). This ensures the namespace
# exists before the Deployment and HPA that reference it.
#
apiVersion: v1
kind: Namespace
metadata:
  name: catalogue-v2
