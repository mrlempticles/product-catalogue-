# k8s/v1/service.yaml
#
# ClusterIP Service for the v1.0 deployment.
# ClusterIP is correct here — external access comes through the Ingress,
# not directly to this service. This service is only reachable within the cluster.
#
apiVersion: v1
kind: Service
metadata:
  name: product-catalogue-svc
  namespace: catalogue-v1
  labels:
    app: product-catalogue
    version: v1.0
spec:
  type: ClusterIP
  selector:
    app: product-catalogue
    version: v1.0
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
